name: Release

# ─────────────────────────────────────────────────────────────────────────────
# Trigger: push to the `release` branch.
# Version is read from the root package.json (no git tags needed).
# No npm publish — all artifacts go to GitHub Releases only.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  # ── Step 0: Read version once, share across all jobs ─────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          VERSION=$(node -p "require('./packages/desktop/package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building SuperAgent v${VERSION}"

  # ── Step 1: Build Tauri desktop installers (Win / macOS / Linux) ──────────
  build-desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build @superagent/core
        run: npm run build --workspace=@superagent/core

      - name: Build @superagent/desktop UI
        run: npm run build:ui --workspace=@superagent/desktop

      - name: Build @superagent/web (needed for --serve inside the desktop)
        run: npm run build --workspace=@superagent/web

      - name: Build & bundle Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Creates a draft release (or adds to one if it already exists for this tag).
          tagName: v${{ needs.version.outputs.version }}
          releaseName: SuperAgent v${{ needs.version.outputs.version }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  # ── Step 2: Build server tarballs for headless --serve deployments ─────────
  build-server:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            ext: tar.gz
          - os: windows-latest
            label: windows-x64
            ext: zip
          - os: macos-latest
            label: macos-arm64
            ext: zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: |
          npm run build --workspace=@superagent/core
          npm run build --workspace=@superagent/cli
          npm run build --workspace=@superagent/web

      # Bundle CLI + Web into a self-contained directory ready to tar/zip.
      - name: Assemble server bundle
        shell: bash
        run: |
          VERSION=${{ needs.version.outputs.version }}
          BUNDLE="superagent-server-v${VERSION}-${{ matrix.label }}"
          mkdir -p "${BUNDLE}"

          # Copy CLI dist
          cp -r packages/cli/dist "${BUNDLE}/cli"
          cp packages/cli/package.json "${BUNDLE}/cli/"

          # Copy Web dist (the server binary)
          cp -r packages/web/dist "${BUNDLE}/web"
          cp packages/web/package.json "${BUNDLE}/web/"

          # Copy Core dist (runtime dependency)
          cp -r packages/core/dist "${BUNDLE}/core"
          cp packages/core/package.json "${BUNDLE}/core/"

          # Write a minimal root package.json so node resolves the workspace
          node -e "
            const pkg = require('./package.json');
            const mini = { name: 'superagent-server', version: pkg.version, type: 'module' };
            require('fs').writeFileSync('${BUNDLE}/package.json', JSON.stringify(mini, null, 2));
          "

          # Launcher scripts
          cat > "${BUNDLE}/README.md" << 'EOF'
          # SuperAgent Server — Headless / HomeLab

          ## Start the web server
          \`\`\`
          node cli/dist/bin/main.js --serve
          # or with a custom port:
          node cli/dist/bin/main.js --serve --serve-port 8080
          \`\`\`

          Access at: http://localhost:14692  (or the port you configured)
          The server binds to 0.0.0.0 by default — accessible from your LAN and public internet.

          ## Update
          \`\`\`
          node cli/dist/bin/main.js update
          \`\`\`
          EOF

          echo "Bundle ready: ${BUNDLE}"
          ls -lh "${BUNDLE}"

      - name: Create tarball (Linux)
        if: matrix.ext == 'tar.gz'
        run: |
          VERSION=${{ needs.version.outputs.version }}
          tar -czf "superagent-server-v${VERSION}-${{ matrix.label }}.tar.gz" \
            "superagent-server-v${VERSION}-${{ matrix.label }}"

      - name: Create zip (Windows / macOS)
        if: matrix.ext == 'zip'
        shell: bash
        run: |
          VERSION=${{ needs.version.outputs.version }}
          BUNDLE="superagent-server-v${VERSION}-${{ matrix.label }}"
          if command -v zip &>/dev/null; then
            zip -r "${BUNDLE}.zip" "${BUNDLE}"
          else
            powershell Compress-Archive -Path "${BUNDLE}" -DestinationPath "${BUNDLE}.zip"
          fi

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.label }}
          path: superagent-server-v${{ needs.version.outputs.version }}-${{ matrix.label }}.${{ matrix.ext }}
          if-no-files-found: error

  # ── Step 3: Generate updater.json + release notes, publish final release ──
  publish:
    needs: [version, build-desktop, build-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Tauri artifacts (for updater.json sig files)
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Download server tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: server-*
          path: server-artifacts
          merge-multiple: true

      - name: Generate updater.json
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/generate-updater-json.cjs

      - name: Generate release notes with download table
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/generate-release-notes.mjs

      - name: Upload server tarballs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          draft: true
          files: |
            server-artifacts/*
            artifacts/updater.json
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish the draft (make it public)
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
