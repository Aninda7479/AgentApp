name: Release

# ─────────────────────────────────────────────────────────────────────────────
# Trigger: push to the `release` branch.
# Auto-bumps version via Conventional Commits, builds installers & CLI binaries,
# and publishes a GitHub Release tagged v<VERSION>.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  # ── Step 0: Auto-bump version & push git tag ─────────────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Auto-bump version & commit
        run: |
          node scripts/bump-version.js auto
          git push origin HEAD:${{ github.ref_name }} || true

      - id: read
        run: |
          VERSION=$(node -p "require('./packages/desktop/package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building SuperAgent v${VERSION}"
          git tag "v${VERSION}" || true
          git push origin "v${VERSION}" || true

  # ── Step 1: Build Tauri desktop installers (Win / macOS / Linux) ──────────
  build-desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build @superagent/core
        run: npm run build --workspace=@superagent/core

      - name: Build @superagent/desktop UI
        run: npm run build:ui --workspace=@superagent/desktop

      - name: Build & bundle Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/desktop
          tagName: v${{ needs.version.outputs.version }}
          releaseName: SuperAgent v${{ needs.version.outputs.version }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  # ── Step 2: Build native standalone binaries for CLI (Pure Rust) ────
  build-cli-binary:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            ext: zip
            binary: superagent.exe
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            ext: tar.gz
            binary: superagent
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
            ext: zip
            binary: superagent
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            ext: zip
            binary: superagent

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build pure native Rust CLI binary
        run: cargo build -p superagent-cli --release --target ${{ matrix.target }}

      - name: Package standalone binary archive
        shell: bash
        run: |
          mkdir -p dist-release-cli
          ARCHIVE="superagent-cli-v${{ needs.version.outputs.version }}-${{ matrix.label }}"
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          mkdir -p staging
          cp "$BIN_PATH" staging/superagent-cli${{ matrix.platform == 'windows-latest' && '.exe' || '' }}
          cp "$BIN_PATH" staging/superagent${{ matrix.platform == 'windows-latest' && '.exe' || '' }}
          chmod +x staging/* 2>/dev/null || true
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cd staging && tar -a -cf "../dist-release-cli/${ARCHIVE}.zip" * && cd ..
          elif [ "${{ matrix.ext }}" = "zip" ]; then
            cd staging && (zip -r "../dist-release-cli/${ARCHIVE}.zip" . 2>/dev/null || tar -a -cf "../dist-release-cli/${ARCHIVE}.zip" *) && cd ..
          else
            cd staging && tar -czf "../dist-release-cli/${ARCHIVE}.tar.gz" . && cd ..
          fi

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-binary-artifacts-${{ matrix.label }}
          path: dist-release-cli/superagent-cli-v*.*
          if-no-files-found: error


  # ── Step 2b: Build Browser Extension (.zip release bundle) ───────────────────
  build-extension:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & Package Browser Extension
        run: |
          npm run pack:ext

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-artifacts
          path: packages/browser-extension/release/superagent-browser-extension-v*.zip
          if-no-files-found: error

  # ── Step 3: Generate updater.json + release notes, publish final release ──
  publish:
    needs: [version, build-desktop, build-cli-binary, build-extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Tauri artifacts (for updater.json sig files)
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Download CLI binary archives
        uses: actions/download-artifact@v4
        with:
          pattern: cli-binary-artifacts-*
          path: cli-artifacts
          merge-multiple: true

      - name: Download Browser Extension release archive
        uses: actions/download-artifact@v4
        with:
          name: extension-artifacts
          path: extension-artifacts

      - name: Generate updater.json
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-updater-json.cjs

      - name: Generate release notes with download table
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/generate-release-notes.mjs

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: SuperAgent v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.ref_name }}
          draft: false
          files: |
            cli-artifacts/*
            extension-artifacts/*
            artifacts/updater.json
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Step 4: Clean up draft release if pipeline fails or is cancelled ────────
  cleanup-draft:
    needs: [version, build-desktop, build-cli-binary, build-extension, publish]
    if: always() && (needs.build-desktop.result == 'failure' || needs.build-desktop.result == 'cancelled' || needs.build-cli-binary.result == 'failure' || needs.build-cli-binary.result == 'cancelled' || needs.build-extension.result == 'failure' || needs.build-extension.result == 'cancelled' || needs.publish.result == 'failure' || needs.publish.result == 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Delete orphaned draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          echo "Pipeline failed or was cancelled. Checking for draft release: ${TAG}"
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" --jq ".[] | select(.tag_name==\"${TAG}\" and .draft==true) | .id" | head -n 1)
          if [ -n "$RELEASE_ID" ]; then
            echo "Deleting orphaned draft release ID: $RELEASE_ID"
            gh api --method DELETE "repos/${{ github.repository }}/releases/$RELEASE_ID" || true
            echo "Orphaned draft release ${TAG} cleaned up successfully."
          else
            echo "No orphaned draft release found for ${TAG}."
          fi
