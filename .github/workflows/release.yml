name: Release

# ─────────────────────────────────────────────────────────────────────────────
# Trigger: push to the `release` branch.
# Version is read from the root package.json (no git tags needed).
# No npm publish — all artifacts go to GitHub Releases only.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - release
      - main
      - rust

permissions:
  contents: write

jobs:
  # ── Step 0: Read version once, share across all jobs ─────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          VERSION=$(node -p "require('./packages/desktop/package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building SuperAgent v${VERSION}"

  # ── Step 1: Build Tauri desktop installers (Win / macOS / Linux) ──────────
  build-desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build @superagent/core
        run: npm run build --workspace=@superagent/core

      - name: Build @superagent/desktop UI
        run: npm run build:ui --workspace=@superagent/desktop

      - name: Build @superagent/web (needed for --serve inside the desktop)
        run: npm run build --workspace=@superagent/web

      - name: Build & bundle Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Creates a draft release (or adds to one if it already exists for this tag).
          tagName: v${{ needs.version.outputs.version }}
          releaseName: SuperAgent v${{ needs.version.outputs.version }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  # ── Step 2: Build self-contained standalone binaries for CLI + Web server ────
  build-cli-binary:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build core & web packages
        run: |
          npm run build --workspace=@superagent/core
          npm run build --workspace=@superagent/web
          npm run build --workspace=@superagent/cli

      - name: Build standalone binaries via pack.mjs
        run: node packages/cli/scripts/pack.mjs

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-binary-artifacts
          path: packages/cli/dist-release-cli/superagent-cli-v*.*
          if-no-files-found: error

  # ── Step 3: Generate updater.json + release notes, publish final release ──
  publish:
    needs: [version, build-desktop, build-cli-binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Tauri artifacts (for updater.json sig files)
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Download CLI binary archives
        uses: actions/download-artifact@v4
        with:
          name: cli-binary-artifacts
          path: cli-artifacts

      - name: Generate updater.json
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/generate-updater-json.cjs

      - name: Generate release notes with download table
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/generate-release-notes.mjs

      - name: Upload CLI binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          draft: true
          files: |
            cli-artifacts/*
            artifacts/updater.json
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish the draft (make it public)
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
