name: "Tauri Release Pipeline"

on:
  push:
    branches:
      - rust
      - main
    tags:
      - 'v*'

jobs:
  calculate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps:set_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: set_version
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

  build-tauri:
    needs: calculate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build Webview UI
        run: npm run build --workspace=@superagent/desktop

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ needs.calculate-version.outputs.version }}
          releaseName: 'SuperAgent v${{ needs.calculate-version.outputs.version }}'
          releaseBody: 'See release details and changelog.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  create-updater-manifest:
    needs: [calculate-version, build-tauri]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate updater.json
        env:
          RELEASE_VERSION: ${{ needs.calculate-version.outputs.version }}
        run: |
          node scripts/generate-updater-json.cjs

      - name: Upload updater.json to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.calculate-version.outputs.version }}
          files: artifacts/updater.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
