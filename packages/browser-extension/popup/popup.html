<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperAgent</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <div class="popup-header">
    <div class="brand">
      <img src="../icons/icon-32.png" alt="SuperAgent">
      <span>SuperAgent</span>
    </div>
    <div class="status-indicator">
      <div id="popupDot" class="dot"></div>
      <span id="popupStatus">Connecting</span>
    </div>
  </div>

  <button id="btnOpenSidePanel" class="btn-main">
    <span>Open Side Panel Chat</span>
    <span>➔</span>
  </button>

  <button id="btnQuickScreenshot" class="btn-secondary">
    📸 Capture Viewport Screenshot
  </button>

  <button id="btnOpenOptions" class="btn-secondary">
    ⚙️ Server Settings & Memory
  </button>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
