[package]
name = "superagent-artifacts-native"
version = "0.29.0"
description = "SuperAgent Native Artifacts Companion & Tray Inspector (egui/eframe)"
authors = ["SuperAgent Contributors"]
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
open = "5.3"
arboard = "3"
