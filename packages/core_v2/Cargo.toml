[package]
name = "superagent-core-v2"
version = "0.10.0"
description = "SuperAgent core_v2 - Pure Rust Agent Intelligence Engine"
authors = ["SuperAgent Contributors"]
edition = "2021"

[lib]
name = "superagent_core_v2"
path = "src/lib.rs"

[[bin]]
name = "superagent-core-daemon"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
async-trait = "0.1"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
regex = "1.10"
walkdir = "2.5"
url = "2.5"
rand = "0.8"
sha2 = "0.10"
