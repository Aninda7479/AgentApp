[package]
name = "superagent-core-v2"
version = "0.27.1"
description = "SuperAgent core_v2 - Pure Rust Agent Intelligence Engine"
authors = ["SuperAgent Contributors"]
edition = "2021"

[lib]
name = "superagent_core_v2"
path = "src/lib.rs"

[[bin]]
name = "superagent-core-daemon"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
async-trait = "0.1"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
regex = "1.10"
walkdir = "2.5"
url = "2.5"
rand = "0.8"
sha2 = "0.10"
axum = { version = "0.7", features = ["ws", "tokio"] }
tower = { version = "0.4", features = ["util", "limit"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "set-header", "compression-br", "compression-gzip"] }
sysinfo = { workspace = true }
async-stream = "0.3"
urlencoding = "2.1"
cron = "0.15"
lru = "0.12"
subtle = "2.6"
dashmap = "5.5"
mime_guess = "2.0"
scrypt = "0.11"
base64 = "0.22"
rust-embed = "8.5"




