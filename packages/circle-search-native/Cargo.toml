[package]
name = "superagent-circle-native"
version = "0.29.0"
description = "SuperAgent Circle to Search — Lightweight Native Rust Overlay (egui/eframe)"
authors = ["SuperAgent Contributors"]
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
screenshots = "0.8"
reqwest = { version = "0.12", features = ["json"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
arboard = "3"
