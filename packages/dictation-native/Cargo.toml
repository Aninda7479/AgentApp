[package]
name = "superagent-dictation-native"
version = "0.29.0"
edition = "2021"
description = "Native, high-performance global voice dictation overlay for SuperAgent"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "x11",
    "wayland",
] }
egui = "0.29"
cpal = "0.15"
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
base64 = "0.22"
arboard = "3.4"
enigo = { version = "0.2", default-features = false }
screenshots = "0.8"
