[package]
name = "superagent-linux-client"
version = "0.1.0"
description = "SuperAgent Dedicated Linux Native UI (GTK4 + Libadwaita)"
authors = ["SuperAgent Contributors"]
edition = "2021"

[lib]
name = "superagent_linux_client"
path = "src/lib.rs"

[[bin]]
name = "superagent-linux"
path = "src/main.rs"

[dependencies]
superagent-core-v2 = { path = "../../packages/core_v2" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tokio-tungstenite = "0.24"
url = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_4"] }
glib = "0.20"
