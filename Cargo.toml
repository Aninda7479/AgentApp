[workspace]
resolver = "2"
members = [
    "packages/core_v2",
    "packages/desktop/src-tauri",
    "packages/cli",
    "packages/circle-search-native",
    "packages/dictation-native",
    "packages/artifacts-native",
]

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"

[profile.dev]
debug = 1
# Disabling incremental compilation prevents `target/debug/incremental` from ballooning into
# 40-50+ GB of stale cache and eliminates heavy disk I/O overhead on Windows during `cargo check`.
# When to change back: Change back to `true` (or run `$env:CARGO_INCREMENTAL=1`) if you are
# doing frequent iterative full binary compiles (`cargo build` / `cargo run`) on a single crate
# and want faster partial-crate LLVM codegen reuse (~2-4s vs ~6-10s).
incremental = true #false
opt-level = 0

[profile.dev.package."*"]
debug = 0
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
